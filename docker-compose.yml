services:
  mongodb:
    image: mongo:7.0
    container_name: colosseum_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: colosseum_db
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - colosseum_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=*
      - MONGODB_URI=mongodb://mongodb:27017/colosseum_db
      - MONGODB_DB_NAME=colosseum_db
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_colosseum_2026_change_in_prod}
      - TOUR_CONTENT_VERSION=1.0.0
    networks:
      - colosseum_net

volumes:
  mongo_data:

networks:
  colosseum_net:
    driver: bridge
